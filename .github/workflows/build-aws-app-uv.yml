name: Build AWS Data Curator with UV

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: true
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'

    - name: Install dependencies with UV
      run: |
        uv sync --frozen --dev

    # - name: Cache UV dependencies
    #   uses: actions/cache@v4
    #   with:
    #     path: |
    #       .uv/cache
    #       .uv/venv
    #     key: ${{ runner.os }}-uv-${{ hashFiles('aws/requirements.txt') }}
    #     restore-keys: |
    #       ${{ runner.os }}-uv-
    

    - name: Build AWS app
      run: |
        uv run python build_aws.py
    
    # - name: List files after build
    #   run: |
    #     echo "Files after build:"
    #     dir
    #     echo "dist directory contents:"
    #     if (Test-Path "dist") { 
    #       dir dist 
    #       echo "dist/AWS_Data_Curator.exe exists:"
    #       if (Test-Path "dist/AWS_Data_Curator.exe") { echo "YES" } else { echo "NO" }
    #       echo "dist/AWS_Data_Curator directory exists:"
    #       if (Test-Path "dist/AWS_Data_Curator") { echo "YES" } else { echo "NO" }
    #     } else { 
    #       echo "dist directory not found" 
    #     }
    
    - name: Create ZIP package
      run: |
        uv run python package_aws.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: aws-app-windows
        path: AWS_Data_Curator_windows_v*.zip
        retention-days: 30

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: true
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'

    - name: Install dependencies with UV
      run: |
        uv sync --frozen --dev

  #   - name: Cache UV dependencies
  #     uses: actions/cache@v4
  #     with:
  #       path: |
  #         .uv/cache
  #         .uv/venv
  #       key: ${{ runner.os }}-uv-${{ hashFiles('aws/requirements.txt') }}
  #       restore-keys: |
  #         ${{ runner.os }}-uv-
  
    - name: Build AWS app
      run: |
        uv run python build_aws.py
    
    - name: Create ZIP package
      run: |
        uv run python package_aws.py
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: aws-app-macos
        path: AWS_Data_Curator_macos_v*.zip
        retention-days: 30

  # 릴리즈 배포 작업 (태그가 있을 때만 실행)
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # 릴리즈 생성 권한 추가
    
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: aws-app-windows
        path: ./windows-artifacts
    
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: aws-app-macos
        path: ./macos-artifacts
    
    - name: Create release assets
      run: |
        mkdir -p release-assets
        cp ./windows-artifacts/*.zip ./release-assets/
        cp ./macos-artifacts/*.zip ./release-assets/
        echo "Release assets created:"
        ls -la release-assets/
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1  # 최신 액션 사용
      with:
        tag_name: ${{ github.ref_name }}
        name: AWS Data Curator ${{ github.ref_name }}
        body: |
          ## AWS Data Curator ${{ github.ref_name }}
          
          ### Changes
          1. 큐레이션 완료시 완료한 시간 업데이트 
          2. PASS 누른 경우에 상태 업데이트 안되는 문제 해결
          3. TEXT 폴더이동 후 삭제 버튼(키보드 5번키) 누른 상태로 이미지 클릭시 dynamodb에 포함되지 않는 것으로 설정 => 이후 LLM으로 캡션 작업시 입력 토큰수 감소 목적 
            - 5번을 한번만 누른 뒤 삭제할 이미지 계속 선택하면 나중에 dynamodb에 반영되지 않고, 선택된 이미지를 한번 더 누르면 취소됨. 
          4. 작업 도중 잘 모르겠는 제품에 대해서는 중앙 패널의 우측영역의 버튼을 누르면 
          5. 가끔 버튼이 눌러도 동작하지 않는 버그 수정 했는데 확인 필요 (ctrl+R 누르면 된다는데 다시 확인 필요)
          
          ### Downloads
          - Windows: AWS_Data_Curator_windows.zip
          - macOS: AWS_Data_Curator_macos.zip
        draft: false
        prerelease: false
        files: |
          ./release-assets/AWS_Data_Curator_windows_v*.zip
          ./release-assets/AWS_Data_Curator_macos_v*.zip
    